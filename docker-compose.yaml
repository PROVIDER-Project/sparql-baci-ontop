services:
  fetch:
    image: curlimages/curl:8.10.1
    user: "0"
    entrypoint: ["/bin/sh", "/opt/loader/fetch.sh"]
    environment:
      BACI_YEARS: "${BACI_YEARS:-2024}"
      BACI_BASE_URL: "${BACI_BASE_URL:-https://maven.inf-ai.duckdns.org/releases/org/aksw/data/thirdparty/fr/cepii/baci/HS92_V202601/1}"
    volumes:
      - ./loader:/opt/loader:ro
      - ./data:/data
      - ./jdbc:/jdbc
  load:
    image: aksw/duckdb-shell:1.5.6
    entrypoint: ["/bin/sh", "/opt/loader/load-duckdb.sh"]
    depends_on:
      fetch:
        condition: service_completed_successfully
    working_dir: /workspace
    command: ["baci.duckdb", "/opt/ontop/input/load.sql"]
    volumes:
      - ./loader:/opt/loader:ro
      - ./data:/data:ro
      - ./run:/workspace
      - ./ontop:/opt/ontop/input:ro
  ontop:
    image: ontop/ontop:5.5.0
    restart: unless-stopped
    depends_on:
      load:
        condition: service_completed_successfully
    ports:
      - "${ONTOP_PORT:-8082}:8080"
    environment:
      ONTOP_LOG_LEVEL: "debug"
      ONTOP_MAPPING_FILE: /opt/ontop/input/baci.r2rml.ttl
      ONTOP_PROPERTIES_FILE: /opt/ontop/input/baci.properties
      ONTOP_CONSTRAINT_FILE: /opt/ontop/input/baci-constraints.lst
      ONTOP_LENSES_FILE: /opt/ontop/input/baci-lenses.json
    volumes:
      - ./ontop:/opt/ontop/input:ro
      - ./jdbc:/opt/ontop/jdbc:ro
      - ./run:/data:ro
