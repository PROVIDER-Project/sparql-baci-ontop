jdbc.url=jdbc:duckdb:/data/baci.duckdb
jdbc.driver=org.duckdb.DuckDBDriver
jdbc.property.duckdb.read_only=true
ontop.queryLogging=true
ontop.applicationName=baci
ontop.queryLogging.includeSparqlQuery=true
ontop.queryLogging.includeReformulatedQuery=true
ontop.cardinalityMode=STRICT

# Query spill files remain writable while the baked database is read-only.
jdbc.property.temp_directory=/tmp/duckdb
